<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stüdyo">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#12152B">
<link rel="apple-touch-icon" href="ikon.png">
<link rel="icon" href="ikon.png">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Stüdyo Notaları</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Düzen: gece stüdyosu zemini. Üstte sahne bandı ve şarkı adı, altında büyük dokunmatik enstrüman kutuları; enstrüman partisi tam ekran açılır. Tek (koyu) tema bilinçli seçim. */
:root{
  --bg:#12152B; --panel:#1B1F3B; --panel2:#232850; --line:#343B73;
  --fg:#F3F5F9; --muted:#AEB6D3; --amber:#F5B93A; --coral:#E8553E;
  --tile:#E7EAF4; --ink:#1B1F3B;
  --display:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px;border-radius:10px}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.05;text-wrap:balance}
p{margin:0}
.wrap{max-width:1040px;margin:0 auto;padding-inline:20px;padding-block:24px 56px;display:flex;flex-direction:column;gap:28px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--amber)}
.muted{color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;background:var(--amber);color:var(--ink);font-weight:700;font-size:16px;padding:7px 14px;border-radius:999px;white-space:nowrap}
.back{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;background:var(--panel2);color:var(--fg);font-weight:600;font-size:16px;align-self:flex-start}
.back:hover{background:var(--line)}

/* Ana ekran */
.home-head{display:flex;flex-direction:column;gap:10px}
.home-head h1{font-size:clamp(40px,7vw,64px);font-weight:800}
.class-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:16px}
.class-card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px}
.class-card h2{font-size:34px;font-weight:800}
.split-list{display:flex;flex-direction:column;gap:10px}
.split-btn{display:flex;flex-direction:column;gap:2px;min-height:56px;justify-content:center;padding:10px 16px;border-radius:14px;background:var(--tile);color:var(--ink);font-weight:700;font-size:18px}
.split-btn small{font-weight:500;font-size:14px;color:#4A5070}
.split-btn:hover{background:#FFFFFF}
.split-btn.is-off{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.split-btn.is-off small{color:var(--muted)}

/* Split ekranı */
.stage{display:grid;grid-template-columns:1fr;background:var(--panel);border-radius:22px;overflow:hidden}
.stage-text{display:flex;flex-direction:column;gap:12px;padding:24px 24px 8px}
.song{font-size:clamp(44px,8vw,76px);font-weight:800;color:#FFFFFF}
.artist{font-size:18px;color:var(--muted)}
.scene{width:100%;aspect-ratio:920/320;max-width:100%}
.scene svg{display:block;width:100%;height:100%}
@media (min-width:760px){
  .stage{grid-template-columns:minmax(0,1fr) minmax(0,1.45fr);align-items:stretch}
  .stage-text{padding:28px 8px 28px 32px;justify-content:center}
  .scene{aspect-ratio:auto;min-height:260px}
}
.pick{display:flex;flex-direction:column;gap:14px}
.pick h2{font-size:26px;font-weight:700}
.inst-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (min-width:640px){.inst-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:900px){.inst-grid{grid-template-columns:repeat(var(--n,5),minmax(0,1fr))}}
.inst-tile{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:20px;background:var(--panel);border:1px solid var(--line);transition:transform .15s ease,border-color .15s ease}
.inst-tile:hover{border-color:var(--amber)}
.inst-tile:active{transform:scale(.97)}
.inst-art{display:flex;align-items:center;justify-content:center;background:var(--tile);border-radius:14px;aspect-ratio:6/5}
.inst-art svg{width:86%;height:auto}
.inst-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 4px 2px}
.inst-name{font-family:var(--display);font-weight:800;font-size:22px}
.inst-count{font-size:14px;color:var(--muted);white-space:nowrap}

/* Enstrüman partisi */
.sheet{position:fixed;inset:0;z-index:10;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-bar{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line)}
.sheet-bar-in{max-width:1040px;margin:0 auto;padding-inline:20px;padding-block:10px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sheet-where{font-size:15px;color:var(--muted)}
.part-head{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.part-head .inst-art{width:120px;flex-shrink:0}
.part-title{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1 1 240px}
.part-title h2{font-size:clamp(40px,7vw,60px);font-weight:800}
.part-title p{font-size:18px;color:var(--muted);max-width:60ch}
.loop-hero{display:flex;align-items:center;flex-wrap:wrap;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px 20px}
.loop-hero .lbl{width:100%;font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--amber)}
.big-chord{font-family:var(--display);font-weight:800;font-size:clamp(34px,6vw,52px);line-height:1;min-width:2.2ch}
.arrow{color:var(--muted);font-size:26px}
.block{display:flex;flex-direction:column;gap:14px}
.block-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.block h3{font-size:26px;font-weight:700}
.tag{font-size:13px;font-weight:700;color:var(--ink);background:var(--muted);padding:3px 10px;border-radius:999px}
.note{color:var(--muted);max-width:62ch}
.chord-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:14px}
.chord-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:6px}
.chord-card h4{font-size:32px;font-weight:800}
.chord-card .sub{font-size:14px;color:var(--muted);text-align:center}
.chord-svg{width:100%;max-width:150px;height:auto}
.piano-row{grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.piano-svg{width:100%;max-width:340px;height:auto}
.strum{display:flex;gap:10px;flex-wrap:wrap}
.strum span{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:14px;background:var(--panel2);font-size:26px;font-weight:700}
.beat-wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px}
table.beat{border-collapse:separate;border-spacing:6px;min-width:520px;width:100%}
table.beat th{font-weight:700;font-size:16px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
table.beat th[scope="row"]{text-align:left;color:var(--fg);white-space:nowrap;padding-right:8px}
table.beat td{text-align:center}
.hit,.rest{display:inline-block;width:34px;height:34px;border-radius:50%}
.hit{background:var(--amber)}
.rest{border:2px solid var(--line)}
.form{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:f}
.form-row{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;counter-increment:f}
@media (min-width:640px){.form-row{grid-template-columns:170px minmax(0,1fr);align-items:center}}
.form-name{font-family:var(--display);font-weight:700;font-size:20px;display:flex;align-items:center;gap:8px}
.form-name::before{content:counter(f);display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--panel2);font-family:var(--body);font-size:14px;color:var(--muted)}
.rep{font-family:var(--body);font-size:14px;font-weight:700;color:var(--ink);background:var(--amber);border-radius:999px;padding:2px 8px}
.form-loops{display:flex;flex-direction:column;gap:6px}
.loop{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:48px;height:36px;padding:0 10px;border-radius:10px;background:var(--panel2);font-weight:700;font-size:17px}
.player{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px 20px;display:flex;flex-direction:column;gap:16px;transition:border-color .15s}
.player.lit{border-color:var(--amber)}
.pl-stage{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 20px;align-items:center}
.pl-now{display:flex;flex-direction:column;gap:2px;min-width:0}
.pl-sec{font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--amber);min-height:1.4em}
.pl-big{font-family:var(--display);font-weight:800;font-size:clamp(72px,16vw,132px);line-height:.95;color:var(--muted);font-variant-numeric:tabular-nums;transition:color .12s,text-shadow .12s;overflow-wrap:anywhere}
.pl-big.words{font-size:clamp(40px,8vw,72px);line-height:1.05}
.player.lit .pl-big{color:var(--amber);text-shadow:0 0 32px rgba(245,185,58,.5)}
.pl-sub{font-size:18px;color:var(--muted);min-height:1.5em}
.pl-count{display:flex;flex-direction:column;align-items:center;gap:10px}
.pl-num{font-family:var(--display);font-weight:800;font-size:clamp(60px,12vw,100px);line-height:1;font-variant-numeric:tabular-nums;min-width:1.2ch;text-align:center}
.pl-dots{display:grid;grid-template-columns:repeat(4,16px);gap:8px;justify-content:center}
.pl-dot{width:16px;height:16px;border-radius:50%;background:var(--panel2);border:2px solid var(--line)}
.pl-dot.on{background:var(--amber);border-color:var(--amber);box-shadow:0 0 10px rgba(245,185,58,.6)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.strip{grid-column:1/-1;position:relative;overflow:hidden;height:84px;border-radius:12px;background:var(--bg);border:1px solid var(--line);--cw:46px}
.strip-track{position:absolute;left:0;top:10px;bottom:6px;display:flex;will-change:transform}
.cell{flex:0 0 var(--cw);width:var(--cw);height:100%;box-sizing:border-box;border-left:1px solid #262B55;position:relative;display:flex;align-items:center;padding-left:6px;transition:background-color .08s}
.cell.bar{border-left:3px solid #5A6290}
.cell .lab{font-family:var(--display);font-weight:800;font-size:28px;color:var(--fg);white-space:nowrap;position:relative;z-index:1;font-variant-numeric:tabular-nums}
.cell .lab.w{font-size:18px}
.cell.ci .lab{color:var(--muted);font-size:20px}
.cell.past{opacity:.3}
.cell.cur{background:var(--amber);border-radius:6px;animation:hop 150ms cubic-bezier(.2,.9,.3,1)}
.cell.cur.start{animation-name:hopBig}
@keyframes hop{0%{transform:translateY(0);background:#FFFFFF}35%{transform:translateY(-6px)}100%{transform:translateY(0);background:var(--amber)}}
@keyframes hopBig{0%{transform:translateY(0) scale(1);background:#FFFFFF}35%{transform:translateY(-10px) scale(1.08)}100%{transform:translateY(0) scale(1);background:var(--amber)}}
.cell.cur .lab{color:var(--ink)}
.strip-head{position:absolute;top:10px;bottom:6px;left:var(--cw);width:var(--cw);border:2px solid var(--fg);border-radius:6px;pointer-events:none;opacity:.55}
.player.beat .pl-num{animation:beat .18s ease-out}
@keyframes beat{from{transform:scale(1.18)}to{transform:scale(1)}}
.pl-controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bpm{display:inline-flex;align-items:center;gap:8px;background:var(--panel2);border-radius:14px;padding:4px}
.bpm button{width:48px;height:48px;border-radius:10px;border:0;background:var(--line);color:var(--fg);font-size:26px;font-weight:700;cursor:pointer}
.bpm button:disabled{opacity:.35;cursor:default}
.bpm output{font-family:var(--display);font-weight:800;font-size:28px;min-width:2.6ch;text-align:center;font-variant-numeric:tabular-nums}
.bpm span{font-size:13px;font-weight:700;color:var(--muted);margin-right:6px}
.pl-btn{min-height:56px;padding:0 20px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);font:700 17px var(--body);cursor:pointer}
.pl-btn:disabled{opacity:.4;cursor:default}
.pl-btn.primary{background:var(--amber);color:var(--ink);border-color:var(--amber);font-size:19px;min-width:150px}
.pl-msg{color:var(--muted);font-size:15px;min-height:1.5em;max-width:70ch}
.chip.now{background:var(--amber);color:var(--ink);box-shadow:0 0 12px rgba(245,185,58,.6)}
.chip-fret.now{color:var(--ink)}
.form-row.now{border-color:var(--amber)}
@media (prefers-reduced-motion:reduce){.player.beat .pl-num{animation:none}.cell.cur{animation:none}.strip-track{transition:none}}
.loop-hero.spread{gap:14px 28px}
.loop-item{display:inline-flex;flex-direction:column;align-items:center;gap:4px}
.fret-sub{font-size:14px;font-weight:700;color:var(--amber);white-space:nowrap}
.chip-fret{color:var(--amber);font-size:19px;font-variant-numeric:tabular-nums}
.fret-num{font-size:44px;font-weight:800;color:var(--amber);font-variant-numeric:tabular-nums}
.fret-word{font-size:18px;font-weight:600;color:var(--muted)}
.fret-head{justify-content:flex-start}
.neck-row{grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.neck-row{grid-template-columns:repeat(2,minmax(0,1fr))}}
.neck-row .chord-card{align-items:stretch}
.fret-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:0 4px}
.fret-big{font-family:var(--display);font-weight:800;font-size:28px;color:var(--amber)}
.neck-wrap{overflow-x:auto}
.neck-svg{display:block;width:100%;min-width:300px;height:auto}
.lyrics-btn{display:inline-flex;align-items:center;gap:10px;align-self:flex-start;min-height:64px;padding:0 28px;border-radius:16px;background:var(--amber);color:var(--ink);font-family:var(--display);font-weight:800;font-size:24px}
.lyrics-btn:hover{background:#FFC95A}
.sheet .player.compact{position:sticky;top:68px;z-index:3;box-shadow:0 10px 24px rgba(10,12,30,.6)}
.player.compact{padding:10px 14px;gap:8px}
.player.compact .pl-stage{grid-template-columns:auto minmax(0,1fr) auto;gap:6px 14px}
.player.compact .pl-now{min-width:84px}
.player.compact .pl-sec{font-size:11px;min-height:1.2em}
.player.compact .pl-big{font-size:48px}
.player.compact .pl-big.words{font-size:22px}
.player.compact .pl-sub{display:none}
.player.compact .strip{grid-column:auto;order:1;height:60px}
.player.compact .strip-track,.player.compact .strip-head{top:7px;bottom:4px}
.player.compact .cell .lab{font-size:22px}
.player.compact .cell .lab.w{font-size:14px}
.player.compact .pl-count{order:2;gap:6px}
.player.compact .pl-num{font-size:40px}
.player.compact .pl-dots{grid-template-columns:repeat(4,10px);gap:5px}
.player.compact .pl-dot{width:10px;height:10px}
.player.compact .pl-controls{gap:8px}
.player.compact .bpm button{width:40px;height:40px;font-size:22px}
.player.compact .bpm output{font-size:22px}
.player.compact .pl-btn{min-height:44px;font-size:15px;padding:0 14px}
.player.compact .pl-btn.primary{min-width:120px;font-size:16px}
.player.compact .pl-msg{font-size:13px;min-height:0}
@media (max-width:700px){.player.compact .pl-stage{grid-template-columns:auto 1fr}.player.compact .strip{grid-column:1/-1}}
.lyr{display:flex;flex-direction:column;gap:14px}
.lyr-sec{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.lyr-sec.now{border-color:var(--amber)}
.lyr-name{font-size:14px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);font-family:var(--body)}
.lyr-line{display:flex;flex-wrap:wrap;align-items:flex-end;row-gap:6px;padding:4px 6px;border-radius:10px;min-width:0}
.lyr-line.now{background:var(--panel2)}
.seg{display:inline-flex;flex-direction:column;align-items:flex-start;gap:2px}
.box{min-height:38px;display:flex;align-items:flex-end;padding-right:6px}
.box .chip{height:34px;min-width:40px;font-size:17px}
.txt{font-size:22px;line-height:1.3;white-space:pre-wrap;color:var(--fg)}
.lyr-line.bare .txt{display:none}
.tip{display:flex;gap:12px;align-items:flex-start;background:var(--panel2);border-radius:16px;padding:14px 16px;max-width:72ch}
.tip b{color:var(--amber);white-space:nowrap}
@media (prefers-reduced-motion:reduce){.inst-tile{transition:none}.inst-tile:active{transform:none}}
</style>
</head>

const CLASSES = ['7A','7B','7C','8A'];

const LOOP = ['Am','Em','Dm','Em'];

  {name:'Kıta 1', loops:[LOOP, LOOP]},
  {name:'Nakarat', loops:[LOOP, LOOP, LOOP]},
  {name:'Ara bölüm', rep:2, loops:[LOOP]},

/* Gitar: Drop D akort (Re La Re Sol Si Mi). Power akor = en kalın iki tel, tek parmak, aynı perde.
   Perde = akorun kök sesinin Re'den (D) uzaklığı. */
const NOTE_IDX = {C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
function dropDFret(chord){ const m=chord.match(/^[A-G](#|b)?/); return m ? (NOTE_IDX[m[0]]-2+12)%12 : null; }
function fretLabel(f){ return f===0 ? 'Boş teller' : `${f}. perde`; }
/* Piyano: akor adından üçlü akor (kök + 3/4 + 7 yarım ses), Do'dan başlayan iki oktav içinde. */
const NAMES_SHARP=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const SOLF={C:'Do','C#':'Do♯',D:'Re','D#':'Re♯',E:'Mi',F:'Fa','F#':'Fa♯',G:'Sol','G#':'Sol♯',A:'La','A#':'La♯',B:'Si'};
function triad(chord){ const m=chord.match(/^([A-G](#|b)?)(m(?!aj))?/); const r=NOTE_IDX[m[1]]; return [r, r+(m[3]?3:4), r+7]; }
const FLAT={1:'Re♭',3:'Mi♭',6:'Sol♭',8:'La♭',10:'Si♭'};
let FLATS=false; /* bemollü tonlarda (ör. Re minör) Si♭ yazılır */
function solf(n){ const i=n%12; return (FLATS&&FLAT[i]) || SOLF[NAMES_SHARP[i]]; }
function useFlats(ch){ const m=ch.match(/^([A-G])(#|b)?(m(?!aj))?/); if(m[2]==='b') return true; if(m[2]==='#') return false; return m[3] ? 'DGCF'.includes(m[1]) : m[1]==='F'; }
function chordNotes(ch){ FLATS=useFlats(ch); return triad(ch).map(solf); }
function chordsOf(s){
  const sh=activeSheet(s);
  if(sh) return [...new Set(sh.flatMap(x=>x.lines.flatMap(l=>l.chords.map(c=>c.c))))];
  return [...new Set((s.loop || s.form.flatMap(x=>x.loops.flat())).map(t=>t.split(':')[0]))];
}

/* ---------- Sözler + akorlar: öğretmenin yapıştırdığı "akor üstte, söz altta" metni (sozler/<split>.txt) ---------- */
const SHEETS={};
const SEC_TR={'intro':'Giriş','verse':'Kıta','pre-chorus':'Ön nakarat','prechorus':'Ön nakarat','pre chorus':'Ön nakarat','chorus':'Nakarat','refrain':'Nakarat','bridge':'Köprü','instrumental':'Enstrümantal','interlude':'Ara bölüm','solo':'Solo','outro':'Bitiş','ending':'Bitiş'};
const CH_RE=/^[A-G](#|b)?(maj|min|m|dim|aug|sus|add)?\d*(\/[A-G](#|b)?)?$/;
function parseTok(t){
  if(/^\d+$/.test(t)) return {dur:+t};
  const m=t.match(/^([A-G](#|b)?m?)([248])$/); if(m) return {c:m[1],beats:+m[3]};
  if(CH_RE.test(t)) return {c:t};
  return null;
}
function isChordLine(line){
  const toks=line.trim().split(/\s+/).filter(Boolean);
  if(!toks.length) return false;
  const ps=toks.map(parseTok);
  return ps.every(Boolean) && ps.some(x=>x.c);
}
function parseSheet(text,defBeats){
  const lines=text.replace(/\r/g,'').replace(/\t/g,'    ').split('\n'), out=[]; let sec=null;
  const open=name=>{ sec={name,lines:[]}; out.push(sec); };
  for(let i=0;i<lines.length;i++){
    const L=lines[i], t=L.trim();
    if(!t || t.startsWith('#')) continue;
    const h=t.match(/^\[(.+?)\]$/);
    if(h){ const key=h[1].toLowerCase().replace(/\s*\d+$/,'').trim(); open(SEC_TR[key]||h[1]); continue; }
    if(isChordLine(L)){
      const chords=[], re=/\S+/g; let m;
      while((m=re.exec(L))){ const q=parseTok(m[0]); if(q.c) chords.push({c:q.c,beats:q.beats||0,col:m.index}); else if(chords.length) chords[chords.length-1].beats=q.dur; }
      let lyric=''; const nx=lines[i+1];
      if(nx!==undefined && nx.trim() && !nx.trim().startsWith('#') && !isChordLine(nx) && !/^\[.+\]$/.test(nx.trim())){ lyric=nx; i++; }
      if(!sec) open('');
      sec.lines.push({chords,lyric}); continue;
    }
    if(!sec) open('');
    sec.lines.push({chords:[],lyric:L});
  }
  out.forEach(x=>x.lines.forEach(l=>l.chords.forEach(c=>{ if(!c.beats) c.beats=defBeats; })));
  return out.filter(x=>x.lines.length);
}
function activeSheet(s){ const x=s&&SHEETS[s.id]; return x&&x.status==='ok' ? x.data : null; }
function loadSheet(sid){
  if(SHEETS[sid]) return;
  SHEETS[sid]={status:'loading'};
  fetch(`sozler/${sid}.txt`,{cache:'no-cache'}).then(r=>r.ok?r.text():'').then(t=>{
    const sheet=t && t.split('\n').some(l=>l.trim() && !l.trim().startsWith('#')) ? parseSheet(t,SPLITS[sid].beats||4) : null;
    const hasChords=sheet && sheet.some(x=>x.lines.some(l=>l.chords.length));
    SHEETS[sid]= hasChords ? {status:'ok',data:sheet} : {status:'none'};
    if(hasChords && location.hash.replace('#','').split('-')[0]===sid && !P.on) render();
  }).catch(()=>{ SHEETS[sid]={status:'none'}; });
}
function sheetLine(ln,si,ri,kind,words){
  const L=ln.lyric||'';
  if(words || !ln.chords.length) return L.trim() ? `<div class="lyr-line" data-line="${si}-${ri}"><span class="seg"><span class="txt">${esc(L.trim())}</span></span></div>` : '';

function powerSVG(f){
  const nut=44, fw=28, sy=i=>20+i*14, F='font-family="Figtree,sans-serif"';
  const labels=['Re','La','Re','Sol','Si','Mi'];
  let o=`<svg class="neck-svg" viewBox="0 0 412 128" role="img" aria-label="En kalın iki tel, ${fretLabel(f)}">`;
  o+=`<rect x="${nut}" y="${sy(0)-6}" width="${12*fw}" height="${sy(5)-sy(0)+12}" rx="4" fill="#232850"/>`;
  [3,5,7,9].forEach(k=>{o+=`<circle cx="${nut+(k-0.5)*fw}" cy="${(sy(2)+sy(3))/2}" r="4" fill="#343B73"/>`});
  o+=`<circle cx="${nut+11.5*fw}" cy="${sy(1)+7}" r="4" fill="#343B73"/><circle cx="${nut+11.5*fw}" cy="${sy(3)+7}" r="4" fill="#343B73"/>`;
  for(let k=1;k<=12;k++) o+=`<line x1="${nut+k*fw}" x2="${nut+k*fw}" y1="${sy(0)-6}" y2="${sy(5)+6}" stroke="#4A5070" stroke-width="2"/>`;
  o+=`<rect x="${nut-4}" y="${sy(0)-6}" width="5" height="${sy(5)-sy(0)+12}" fill="#F3F5F9"/>`;
  for(let i=0;i<6;i++){
    const play=i<2;
    o+=`<line x1="${nut}" x2="${nut+12*fw}" y1="${sy(i)}" y2="${sy(i)}" stroke="${play?'#F3F5F9':'#6B739A'}" stroke-width="${(3.2-i*0.4).toFixed(1)}"/>`;
    o+=`<text x="12" y="${sy(i)+4}" text-anchor="middle" font-size="11" font-weight="${play?700:400}" fill="${play?'#F5B93A':'#6B739A'}" ${F}>${labels[i]}</text>`;
  }
  if(f===0){
    [0,1].forEach(i=>{o+=`<circle cx="30" cy="${sy(i)}" r="6" fill="#12152B" stroke="#F5B93A" stroke-width="2.5"/>`});
  } else {
    const cx=nut+(f-0.5)*fw;
    o+=`<rect x="${cx-10}" y="${sy(0)-10}" width="20" height="${sy(1)-sy(0)+20}" rx="10" fill="#F5B93A"/>`;
    o+=`<text x="${cx}" y="${(sy(0)+sy(1))/2+4}" text-anchor="middle" font-size="12" font-weight="700" fill="#1B1F3B" ${F}>1</text>`;
  }
  for(let k=1;k<=12;k++){
    const on=k===f;
    o+=`<text x="${nut+(k-0.5)*fw}" y="122" text-anchor="middle" font-size="${on?14:11}" font-weight="${on?800:500}" fill="${on?'#F5B93A':'#AEB6D3'}" ${F}>${k}</text>`;
  }
  return o+`</svg>`;
}

function pianoSVG(name){
  FLATS=useFlats(name);
  const on=new Set(triad(name)), W=24, H=112, F='font-family="Figtree,sans-serif"';
  const whiteSemi=[0,2,4,5,7,9,11], blackAfter=[[0,1],[1,3],[3,6],[4,8],[5,10]];
  let o=`<svg class="piano-svg" viewBox="0 0 ${14*W+2} ${H+2}" role="img" aria-label="${name} akoru, piyano tuşları: ${triad(name).map(solf).join(', ')}">`;
  for(let k=0;k<14;k++){
    const semi=Math.floor(k/7)*12+whiteSemi[k%7], hit=on.has(semi);
    o+=`<rect x="${1+k*W}" y="1" width="${W}" height="${H}" rx="3" fill="${hit?'#F5B93A':'#F3F5F9'}" stroke="#12152B" stroke-width="1.5"/>`;
    if(hit) o+=`<text x="${1+k*W+W/2}" y="${H-10}" text-anchor="middle" font-size="11" font-weight="700" fill="#1B1F3B" ${F}>${solf(semi)}</text>`;
  }
  for(let oc=0;oc<2;oc++) blackAfter.forEach(([idx,s])=>{
    const semi=oc*12+s, hit=on.has(semi), x=1+(oc*7+idx+1)*W-8;
    o+=`<rect x="${x}" y="1" width="16" height="68" rx="2" fill="${hit?'#F5B93A':'#1B1F3B'}" stroke="#12152B" stroke-width="1"/>`;
    if(hit) o+=`<text x="${x+8}" y="60" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1B1F3B" ${F}>${solf(semi)}</text>`;
  });
  return o+`</svg>`;
}

const COUNT_IN = 4;
const NOTE_ONLY = new Set(['keman','flut']);

function buildSeq(s){
  const sh=activeSheet(s);
  if(sh){
    const q=[];
    sh.forEach((sec,si)=>sec.lines.forEach((ln,ri)=>ln.chords.forEach((c,ci)=>q.push({si,ri,ci,c:c.c,beats:c.beats,sec:sec.name||'Şarkı'}))));
    if(q.length) return q;
  }
  const seq=[];
  s.form.forEach((sec,si)=>{
    for(let r=0;r<(sec.rep||1);r++) sec.loops.forEach((row,ri)=>row.forEach((tok,ci)=>{
      const [c,b]=tok.split(':');
      seq.push({si,ri,ci,c,beats:(+b)||s.beats||4,sec:sec.name});
    }));
  });
  return seq;
}
function itemView(it,kind){
  if(kind==='gitar'){ const f=dropDFret(it.c); return {big:String(f), sub:f===0?'boş teller':'perde', next:fretLabel(f)}; }
  if(kind==='vokal'||NOTE_ONLY.has(kind)) return {big:it.sec, sub:'', next:it.sec};
  return {big:it.c, sub:'', next:it.c};
}
function playerHTML(s,i){
  const v=i.kind==='vokal'||NOTE_ONLY.has(i.kind);
  return `<section class="player${activeSheet(s)?' compact':''}" id="player" aria-label="Çalıcı">
    <div class="pl-stage">
      <div class="pl-now">
        <span class="pl-sec" id="pl-sec">${v?'BÖLÜM':'HAZIR'}</span>
        <span class="pl-big${v?' words':''}" id="pl-big" aria-live="off">–</span>
        <span class="pl-sub" id="pl-sub"></span>
      </div>
      <div class="pl-count" aria-hidden="true">
        <span class="pl-num" id="pl-num">4</span>
        <div class="pl-dots" id="pl-dots"></div>
      </div>
      <div class="strip" id="strip" aria-hidden="true"><div class="strip-track" id="strip-track"></div><div class="strip-head"></div></div>
      <span class="sr-only" id="pl-nextbox">Sonra: <b id="pl-next">–</b></span>
    </div>
    <div class="pl-controls">
      <div class="bpm" role="group" aria-label="Tempo">
        <button type="button" id="bpm-down" aria-label="Tempoyu azalt">−</button>
        <output id="bpm-val" aria-live="polite">80</output><span>BPM</span>
        <button type="button" id="bpm-up" aria-label="Tempoyu artır">+</button>
      </div>
      <button type="button" class="pl-btn primary" id="pl-play">▶ Başlat</button>
      <button type="button" class="pl-btn" id="pl-sync">Birlikte başla</button>
      <button type="button" class="pl-btn" id="pl-click" aria-pressed="false">Tık sesi: Kapalı</button>
    </div>
    <p class="pl-msg" id="pl-msg" role="status"></p>
  </section>`;
}
const $=id=>document.getElementById(id);
/* Vuruş şeridi: her vuruş bir kutu, 4 vuruşta bir ölçü çizgisi; şerit sağdan sola akar. */
const LEAD=1, STRIP_CELLS=20;
const RM=window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function stripLabel(it,kind,prev){
  if(kind==='gitar') return String(dropDFret(it.c));
  if(kind==='vokal'||NOTE_ONLY.has(kind)) return (!prev||prev.si!==it.si) ? it.sec : '';
  return it.c;
}
function sizeStrip(){ const st=$('strip'); if(!st) return; const cmp=$('player')&&$('player').classList.contains('compact'); P.cw=Math.max(cmp?34:40,Math.floor(st.clientWidth/(cmp?16:STRIP_CELLS))); st.style.setProperty('--cw',P.cw+'px'); }
function placeStrip(x){ const tr=$('strip-track'); if(tr) tr.style.transform=`translate3d(${(-(Math.max(0,x)-LEAD)*P.cw).toFixed(1)}px,0,0)`; }
function buildStrip(){
  const tr=$('strip-track'); if(!tr) return;
  const words=P.kind==='vokal'||NOTE_ONLY.has(P.kind);
  let h='', n=0, prev=null;
  for(let k=0;k<COUNT_IN;k++) h+=`<div class="cell ci${k===0?' bar':''}"><span class="lab">${COUNT_IN-k}</span></div>`;
  P.seq.forEach(it=>{
    const lab=stripLabel(it,P.kind,prev);
    for(let b=0;b<it.beats;b++){ h+=`<div class="cell${n%4===0?' bar':''}${b===0?' start':''}">${b===0&&lab?`<span class="lab${words?' w':''}">${esc(lab)}</span>`:''}</div>`; n++; }
    prev=it;
  });
  h+=`<div class="cell bar end"><span class="lab w">Son</span></div>`;
  tr.innerHTML=h; P.cells=tr.children; P.curCell=-1; sizeStrip(); placeStrip(0);
}
function markCell(b){
  if(!P.cells) return;
  const c=P.cells[P.curCell]; if(c){ c.classList.remove('cur'); c.classList.add('past'); }
  const n=P.cells[b]; if(n){ void n.offsetWidth; n.classList.add('cur'); }
  P.curCell=b; placeStrip(b);
}
window.addEventListener('resize',()=>{ if($('strip')){ sizeStrip(); if(!P.on) placeStrip(0); } });
function setDots(total,left){
  const box=$('pl-dots'); if(!box) return;
  if(box.childElementCount!==total) box.innerHTML='<span class="pl-dot"></span>'.repeat(total);
  [...box.children].forEach((d,k)=>d.classList.toggle('on',k<left));
}
/* Çalınan satırı çalıcının hemen altına getirir; bir önceki satır da görünür kalır. */
function followLine(line){
  const sc=document.querySelector('.sheet'), pl=$('player'); if(!sc||!pl) return;
  const base=sc.getBoundingClientRect().top;
  const lineTop=line.getBoundingClientRect().top-base+sc.scrollTop;
  const prev=line.previousElementSibling, gap=prev ? prev.getBoundingClientRect().height+16 : 40;
  const under=pl.getBoundingClientRect().bottom-base;
  sc.scrollTo({top:Math.max(0,lineTop-under-gap),behavior:RM?'auto':'smooth'});
}
function markNow(it){
  document.querySelectorAll('.chip.now,.form-row.now,.lyr-sec.now,.lyr-line.now').forEach(e=>e.classList.remove('now'));
  if(!it){ P.lastLine=null; return; }
  const row=document.querySelector(`.form-row[data-si="${it.si}"],.lyr-sec[data-si="${it.si}"]`); row&&row.classList.add('now');
  const line=document.querySelector(`.lyr-line[data-line="${it.si}-${it.ri}"]`);
  if(line){ line.classList.add('now'); if(P.lastLine!==line){ P.lastLine=line; followLine(line); } }
  const chip=document.querySelector(`.chip[data-pos="${it.si}-${it.ri}-${it.ci}"]`); chip&&chip.classList.add('now');
}
function idleMsg(){ if($('player')&&$('player').classList.contains('compact')) return `Tempo ${P.bpm} BPM`; return `Tempo ${P.bpm} BPM. Tek başına çalışmak için Başlat'a bas. Sınıfça çalarken öğretmen “şimdi” deyince herkes Birlikte başla'ya bassın.`; }
function resetDisplay(){
  buildStrip();
  const first=P.seq[0];
  const sv=P.kind==='vokal'||NOTE_ONLY.has(P.kind);
  $('pl-big').textContent= sv ? first.sec : '–';
  $('pl-sub').textContent='';
  $('pl-sec').textContent= sv ? 'BÖLÜM' : 'HAZIR';
  $('pl-num').textContent=String(COUNT_IN);
  $('pl-next').textContent=itemView(first,P.kind).next;
  $('pl-nextbox').classList.remove('soon');
  setDots(COUNT_IN,COUNT_IN);
  $('player').classList.remove('lit');
  markNow(null);
}
function clickAt(t,accent){
  if(!P.click||!P.ac) return;
  try{
    const o=P.ac.createOscillator(), g=P.ac.createGain();
    o.frequency.value=accent?1800:880; g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(accent?0.7:0.3,t+0.002); g.gain.exponentialRampToValueAtTime(0.0001,t+(accent?0.08:0.045));
    o.connect(g).connect(P.ac.destination); o.start(t); o.stop(t+0.09);
  }catch(e){}
}
function flash(){ const p=$('player'); if(!p) return; p.classList.remove('beat'); void p.offsetWidth; p.classList.add('beat'); }
function onBeat(b){
  markCell(b);
  if(b<COUNT_IN){
    const left=COUNT_IN-b;
    $('pl-sec').textContent='SAYIM'; $('pl-big').textContent= (P.kind==='vokal'||NOTE_ONLY.has(P.kind)) ? P.seq[0].sec : 'Hazır';
    $('pl-sub').textContent=''; $('pl-num').textContent=String(left); setDots(COUNT_IN,left);
    $('pl-next').textContent=itemView(P.seq[0],P.kind).next; $('pl-nextbox').classList.toggle('soon',left===1);
    $('player').classList.remove('lit'); flash(); return;
  }
  const x=b-COUNT_IN; let k=0;
  while(k<P.seq.length && P.cum[k+1]<=x) k++;
  if(k>=P.seq.length){ finish(); return; }
  const it=P.seq[k], into=x-P.cum[k], left=it.beats-into, v=itemView(it,P.kind), nx=P.seq[k+1];
  $('pl-sec').textContent=it.sec.toLocaleUpperCase('tr');
  $('pl-big').textContent=v.big; $('pl-sub').textContent=v.sub;
  $('pl-num').textContent=String(left); setDots(it.beats,left);
  $('pl-next').textContent= nx ? itemView(nx,P.kind).next : 'Bitiş';
  $('pl-nextbox').classList.toggle('soon',left===1);
  $('player').classList.add('lit'); markNow(it); flash();
}
/* Tık sesleri ses saatine önceden planlanır: ekran yenilemesinden bağımsız, vuruşla tam aynı anda. */
function scheduleClicks(now,bms){
  if(!P.click||!P.ac) return;
  if(P.nextClick==null) P.nextClick=Math.max(0,Math.ceil((now-P.t0)/bms));
  const lat=(P.ac.outputLatency||P.ac.baseLatency||0);
  while(P.nextClick<P.total){
    const tb=P.t0+P.nextClick*bms;
    if(tb>now+150) break;
    if(tb>=now-15){
      const k=P.nextClick, accent = P.starts.has(k);
      clickAt(Math.max(P.ac.currentTime, P.ac.currentTime+(tb-now)/1000-lat), accent);
    }
    P.nextClick++;
  }
}
function loop(){
  if(!P.on) return;
  const now=Date.now(), bms=60000/P.bpm;
  if(now<P.t0){
    placeStrip(0); scheduleClicks(now,bms);
    const sec=Math.ceil((P.t0-now)/1000);
    const m=$('pl-msg'); if(m) m.textContent=`Birlikte başlıyoruz: ${sec} sn`;
    P.raf=requestAnimationFrame(loop); return;
  }
  const xf=(now-P.t0)/bms, b=Math.floor(xf);
  scheduleClicks(now,bms);
  if(b!==P.lastBeat){ P.lastBeat=b; const m=$('pl-msg'); if(m && b===0) m.textContent=`Çalıyor · ${P.bpm} BPM`; onBeat(b); }
  if(P.on) P.raf=requestAnimationFrame(loop);
}
function ensureAudio(){
  try{ if(!P.ac){ const AC=window.AudioContext||window.webkitAudioContext; if(AC) P.ac=new AC(); } if(P.ac&&P.ac.state==='suspended') P.ac.resume(); }catch(e){}
}
function setPlaying(on){
  P.on=on;
  const play=$('pl-play'); if(play) play.textContent= on ? '■ Durdur' : '▶ Başlat';
  ['bpm-down','bpm-up'].forEach(id=>{const b=$(id); if(b) b.disabled=on;});
  const sync=$('pl-sync'); if(sync) sync.disabled=on;
}
function start(t0){
  ensureAudio(); P.t0=t0; P.lastBeat=null; P.nextClick=null; setPlaying(true); keepAwake(true);
  cancelAnimationFrame(P.raf); P.raf=requestAnimationFrame(loop);
}
function stopPlayer(){
  cancelAnimationFrame(P.raf);
  if(!P.on) return;
  setPlaying(false);
  if($('player')){ resetDisplay(); $('pl-msg').textContent=idleMsg(); }
}
function finish(){
  cancelAnimationFrame(P.raf); setPlaying(false); markNow(null);
  $('player').classList.remove('lit');
  $('pl-sec').textContent='SON'; $('pl-big').textContent='Bitti'; $('pl-sub').textContent='';
  $('pl-num').textContent='0'; setDots(4,0); $('pl-next').textContent='–';
  $('pl-msg').textContent='Şarkı bitti. Tekrar çalmak için Başlat\'a bas.';
}
function initPlayer(sid,instId){
  const s=SPLITS[sid], i=s.instruments.find(x=>x.id===instId);
  if(!i||!$('player')) return;
  if(P.sid!==sid){
    let saved=null; try{ saved=+localStorage.getItem('bpm-'+sid); }catch(e){}
    P.bpm=(saved>=40&&saved<=200)?saved:(s.bpm||80); P.sid=sid;
  }
  P.kind=i.kind; P.seq=buildSeq(s); P.cum=[0];
  P.seq.forEach(it=>P.cum.push(P.cum[P.cum.length-1]+it.beats));
  P.total=COUNT_IN+P.cum[P.cum.length-1];
  P.starts=new Set(P.cum.slice(0,-1).map(c=>COUNT_IN+c)); /* akor değişen vuruşlar: tiz tık */
  $('bpm-val').textContent=String(P.bpm);
  $('pl-click').textContent=`Tık sesi: ${P.click?'Açık':'Kapalı'}`; $('pl-click').setAttribute('aria-pressed',String(P.click));
  resetDisplay(); $('pl-msg').textContent=idleMsg();
  const bump=d=>{
    P.bpm=Math.max(40,Math.min(200,P.bpm+d)); $('bpm-val').textContent=String(P.bpm); $('pl-msg').textContent=idleMsg();
    try{ localStorage.setItem('bpm-'+sid,String(P.bpm)); }catch(e){}
  };
  $('bpm-down').onclick=()=>bump(-5);
  $('bpm-up').onclick=()=>bump(5);
  $('pl-play').onclick=()=>{ if(P.on) stopPlayer(); else start(Date.now()+150); };
  $('pl-sync').onclick=()=>{ start(Math.ceil((Date.now()+2000)/10000)*10000); };
  $('pl-click').onclick=()=>{ P.click=!P.click; P.nextClick=null; if(P.click) ensureAudio(); $('pl-click').textContent=`Tık sesi: ${P.click?'Açık':'Kapalı'}`; $('pl-click').setAttribute('aria-pressed',String(P.click)); };
}

function lyricsHref(s){
  if(s.lyricsUrl) return s.lyricsUrl;
  const q=`${s.song} ${s.artist||''} şarkı sözleri`.replace(/\s+/g,' ').trim();
  return 'https://www.google.com/search?q='+encodeURIComponent(q)+'&safe=active';
}
function partBody(s,i){
  const uniq=chordsOf(s);
  if(i.kind==='gitar') return `<section class="block">
      <div class="block-head"><h3>Perdeler</h3><span class="tag">Drop D</span></div>
      <div class="chord-row neck-row">${[...new Set(uniq.map(dropDFret))].sort((x,y)=>x-y).map(f=>`<div class="chord-card"><div class="fret-head"><h4 class="fret-num">${f}</h4><span class="fret-word">${f===0?'boş teller':'perde'}</span></div><div class="neck-wrap">${powerSVG(f)}</div></div>`).join('')}</div>
      <p class="note">Akort: Drop D. Teller kalından inceye Re – La – Re – Sol – Si – Mi. Sarı işaret, işaret parmağınla (1) iki kalın teli birlikte bastığın yer. Diğer dört teli çalma.</p>
    </section>
    <section class="block">
      <div class="block-head"><h3>Ritim</h3><span class="tag">Öneri</span></div>
      <div class="strum" aria-label="aşağı, aşağı, aşağı, aşağı"><span>↓</span><span>↓</span><span>↓</span><span>↓</span></div>
      <p class="note">Her vuruşta aşağı doğru vur. Öğretmeninin gösterdiği ritim önceliklidir.</p>
    </section>`;
  if(i.kind==='piyano') return `<section class="block">
      <div class="block-head"><h3>Akorlar</h3></div>
      <div class="chord-row piano-row">${uniq.map(c=>`<div class="chord-card"><h4>${c}</h4>${pianoSVG(c)}<p class="sub">Sağ el: ${chordNotes(c).join(' – ')} · Sol el: ${chordNotes(c)[0]}</p></div>`).join('')}</div>
    </section>`;
  if(i.kind==='bateri') return `<section class="block">
      <div class="block-head"><h3>Temel ritim</h3><span class="tag">Öneri</span></div>
      ${beatTable([
        {name:'Hi-hat', hits:[1,1,1,1,1,1,1,1]},
        {name:'Trampet', hits:[0,0,1,0,0,0,1,0]},
        {name:'Bas davul', hits:[1,0,0,0,1,0,0,0]}
      ])}
      <p class="note">“1 & 2 & 3 & 4 &” diye sayarak çal. Sarı daireler vuracağın yerler. Öğretmeninin gösterdiği ritim önceliklidir.</p>
    </section>`;
  if(i.kind==='perkusyon') return `<section class="block">
      <div class="block-head"><h3>İki parti</h3><span class="tag">Öneri</span></div>
      ${beatTable([
        {name:'1 · Shaker / marakas', hits:[1,1,1,1,1,1,1,1]},
        {name:'2 · Konga', hits:[0,0,1,0,0,0,1,1]}
      ])}
      <p class="note">“1 & 2 & 3 & 4 &” diye sayarak çal. Sarı daireler vuracağın yerler. Öğretmeninin gösterdiği ritim önceliklidir.</p>
    </section>`;
  if(i.kind==='vokal') return `<section class="block">
      <div class="block-head"><h3>Sözler</h3></div>
      <a class="lyrics-btn" href="${esc(lyricsHref(s))}" target="_blank" rel="noopener">Sözleri aç <span aria-hidden="true">↗</span></a>
      <p class="note">Sözler yeni sekmede açılır. Bitince bu sekmeye geri dön; bölümlerin sırası aşağıda.</p>
    </section>`;
  if(NOTE_ONLY.has(i.kind)) return `<section class="block">
      <div class="block-head"><h3>Nota</h3></div>
      <p class="note">Bu partinin notası hazırlanıyor. Şimdilik öğretmeninin verdiği notadan çal; çalıcı sana hangi bölümde olduğunu gösterir.</p>
    </section>`;
  return '';
}

function partView(id,instId){
  const s=SPLITS[id], i=s.instruments.find(x=>x.id===instId);
  if(!i) return '';
  const isG=i.kind==='gitar';
  const isLoop=!!s.loop, seq=isG && !isLoop ? [...new Set(chordsOf(s).map(dropDFret))].sort((x,y)=>x-y) : (s.loop||chordsOf(s));
  const heroLbl=isG ? (isLoop?'Perde döngüsü':'Şarkıdaki perdeler') : (isLoop?'Akor döngüsü':'Şarkıdaki akorlar');
  const loopLabel=isG ? seq.map(c=>fretLabel(typeof c==='number'?c:dropDFret(c))).join(', ') : seq.join(', ');
  const loop=seq.map((c,k)=>{
    const f=typeof c==='number'?c:dropDFret(c);
    const inner=isG ? `<span class="big-chord">${f}</span><span class="fret-sub">${f===0?'boş teller':'perde'}</span>` : `<span class="big-chord">${c}</span>`;
    return `${k&&isLoop?'<span class="arrow" aria-hidden="true">→</span>':''}<span class="loop-item">${inner}</span>`;
  }).join('');
  return `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="part-title">
    <div class="sheet-bar"><div class="sheet-bar-in">
      <a class="back" href="#${id}">← Enstrümanlar</a>
      <span class="sheet-where">${splitLabel(id)} · ${esc(s.song)}</span>
    </div></div>
    <div class="wrap">
      <header class="part-head">
        <span class="inst-art" aria-hidden="true">${ICONS[i.kind]}</span>
        <div class="part-title"><h2 id="part-title" tabindex="-1">${esc(i.name)}</h2><p>${esc(i.lead)}</p></div>
      </header>
      ${playerHTML(s,i)}
      ${i.kind==='vokal'||NOTE_ONLY.has(i.kind)?'':`<div class="loop-hero${isLoop?'':' spread'}" aria-label="${heroLbl}: ${loopLabel}"><span class="lbl">${heroLbl.toLocaleUpperCase('tr')}</span>${loop}</div>`}
      ${partBody(s,i)}
      <section class="block">
        <div class="block-head"><h3>${activeSheet(s)?(i.kind==='vokal'||NOTE_ONLY.has(i.kind)?'Sözler':'Sözler ve akorlar'):'Şarkının akışı'}</h3></div>
        ${activeSheet(s)?sheetHTML(activeSheet(s),i.kind):formHTML(s.form,i.kind)}
      </section>
      <div class="tip"><b>İpucu</b><span>${esc(i.tip)}</span></div>
    </div>
  </div>`;
}

async function keepAwake(on){
  try{
    if(on && 'wakeLock' in navigator && !wakeLock){ wakeLock=await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release',()=>{wakeLock=null}); }
    if(!on && wakeLock){ await wakeLock.release(); wakeLock=null; }
  }catch(e){ wakeLock=null; }
}

function render(){
  stopPlayer();
  const h=location.hash.replace('#','');
  const [id,inst]=h.split('-');
  if(id && SPLITS[id]){
    loadSheet(id);
    app.innerHTML=splitView(id)+(inst?partView(id,inst):'');
    const open=!!(inst && app.querySelector('.sheet'));
    document.body.classList.toggle('locked',open);
    keepAwake(open);
    if(open){ initPlayer(id,inst); const t=document.getElementById('part-title'); t&&t.focus({preventScroll:true}); }
    else window.scrollTo(0,0);
  } else {
    app.innerHTML=homeView();
    document.body.classList.remove('locked');
    keepAwake(false);
    window.scrollTo(0,0);
  }
  const s=SPLITS[id];
  document.title = s ? `${s.song} · ${splitLabel(id)}` : 'Stüdyo Notaları';
}
window.addEventListener('hashchange',render);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){const [id,inst]=location.hash.replace('#','').split('-'); if(inst) location.hash=id;}
});
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && document.querySelector('.sheet')) keepAwake(true); });
render();
</script>

</body>
