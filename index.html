<style id="app-style">
/* Layout: phone-first single column; sticky date header, content, fixed bottom tab bar (like a teacher's pocket planner). */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --ink:#18213a; --muted:#5d6782; --line:#dde2ec;
  --accent:#2f4fd8; --accent-ink:#ffffff; --duty:#d98a12; --now:#0f9d6b; --danger:#c8372d;
  --soft:#e8ecf6;
  --f-display:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141f; --surface:#191f2d; --ink:#e8ecf6; --muted:#9aa4bd; --line:#2a3246;
  --accent:#7d95ff; --accent-ink:#0d1224; --duty:#f0a93a; --now:#35c992; --danger:#ff7a6e; --soft:#222a3c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141f; --surface:#191f2d; --ink:#e8ecf6; --muted:#9aa4bd; --line:#2a3246;
  --accent:#7d95ff; --accent-ink:#0d1224; --duty:#f0a93a; --now:#35c992; --danger:#ff7a6e; --soft:#222a3c; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
#app{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.86em}
.muted{color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.top h1{font-size:1.6rem;font-weight:700}
.top .eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
/* Now card */
.now{background:var(--ink);color:var(--bg);border:none;border-radius:18px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:10px}
.now .lbl{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;opacity:.7;font-weight:600;display:flex;align-items:center;gap:6px}
.now .lbl .dot{width:8px;height:8px;border-radius:50%;background:var(--now);box-shadow:0 0 0 4px color-mix(in oklab,var(--now) 35%,transparent)}
.now .big{font-family:var(--f-display);font-size:1.9rem;font-weight:700;line-height:1.05}
.now .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.9rem;opacity:.85}
.now .bar{height:6px;border-radius:3px;background:color-mix(in oklab,var(--bg) 22%,transparent);overflow:hidden}
.now .bar i{display:block;height:100%;background:var(--now)}
.now .next{border-top:1px solid color-mix(in oklab,var(--bg) 20%,transparent);padding-top:10px;font-size:.9rem;opacity:.9}
.dutybanner{display:flex;gap:10px;align-items:flex-start;background:color-mix(in oklab,var(--duty) 16%,var(--surface));border:1px solid color-mix(in oklab,var(--duty) 45%,var(--line));border-radius:14px;padding:12px 14px}
.dutybanner .ic{flex:none;width:28px;height:28px;border-radius:8px;background:var(--duty);color:#1b1305;display:grid;place-items:center;font-weight:800;font-size:.8rem}
/* Timeline */
.tl{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:62px 1fr;gap:10px;padding-block:9px;border-bottom:1px solid var(--line);align-items:start}
.row:last-child{border-bottom:none}
.row .t{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);line-height:1.3;padding-top:3px}
.row .t b{display:block;color:var(--ink);font-weight:500;font-size:.86rem}
.row.past{opacity:.5}
.row.cur .t b{color:var(--now)}
.row.cur{position:relative}
.row.cur::before{content:"";position:absolute;left:-10px;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--now)}
.row .pl{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pill{display:flex;flex-direction:column;gap:1px;border-radius:10px;padding:7px 10px;background:color-mix(in oklab,var(--pc) 13%,var(--surface));border:1px solid color-mix(in oklab,var(--pc) 35%,var(--line));min-width:0}
.pill+.pill{margin-top:6px}
.pill .ti{font-weight:700}
.pill .su{font-size:.84rem;color:var(--muted)}
.empty{color:var(--muted);font-size:.9rem;padding-top:2px}
.breakrow .t,.breakrow .empty{font-size:.78rem}
.breakrow{padding-block:5px;background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in oklab,var(--line) 45%,transparent) 6px 7px)}
/* Chips & segmented */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.88rem;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sw{width:10px;height:10px;border-radius:50%;background:var(--pc);flex:none}
/* Week grid */
.gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table.wk{border-collapse:collapse;width:100%;min-width:420px;table-layout:fixed;font-size:.78rem}
.wk th,.wk td{border-bottom:1px solid var(--line);border-left:1px solid var(--line);padding:5px 4px;vertical-align:top;text-align:center}
.wk th:first-child,.wk td:first-child{border-left:none;width:48px;text-align:left;padding-left:8px}
.wk thead th{font-family:var(--f-display);font-weight:700;font-size:.85rem;padding-block:8px}
.wk thead th.today{color:var(--accent)}
.wk td.today{background:color-mix(in oklab,var(--accent) 6%,transparent)}
.wk .pn{font-weight:700;font-size:.8rem}
.wk .pt{font-family:var(--f-mono);font-size:.62rem;color:var(--muted)}
.wk .cell{border-radius:7px;padding:4px 2px;background:color-mix(in oklab,var(--pc) 15%,var(--surface));line-height:1.2;overflow-wrap:anywhere}
.wk .cell b{display:block;font-size:.8rem}
.wk .cell span{font-size:.64rem;color:var(--muted)}
.wk tr.brk td{background:var(--soft);font-size:.68rem;color:var(--muted);padding-block:3px}
.wk tbody tr:last-child td{border-bottom:none}
.daycard h3{font-size:1.05rem;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline}
details.ref{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
details.ref summary{font-weight:700;cursor:pointer}
.reftbl{overflow-x:auto;margin-top:10px}
.reftbl table{border-collapse:collapse;min-width:640px;font-size:.74rem}
.reftbl th,.reftbl td{border:1px solid var(--line);padding:5px 6px;vertical-align:top;text-align:left}
.reftbl th{background:var(--soft)}
.reftbl td.me{background:color-mix(in oklab,var(--duty) 25%,var(--surface));font-weight:700}
/* Lists & forms */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border:none;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.li:last-child{border-bottom:none}
.li .grow{flex:1;min-width:0}
.li .grow b{display:block}
.li .chev{color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:color-mix(in oklab,var(--danger) 45%,var(--line))}
.btn.ghost{background:none;border-color:transparent;color:var(--accent);padding-inline:6px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.8rem;font-weight:600;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:8px;align-items:center;font-weight:500}
.check input{width:18px;height:18px}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors button{width:30px;height:30px;border-radius:50%;background:var(--pc);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.colors button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.bellrow{display:grid;grid-template-columns:1fr 86px 86px 34px;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
.bellrow input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 6px;width:100%;min-width:0}
.bellrow .x{border:none;background:none;color:var(--danger);font-size:1.2rem}
.bellrow.head{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding-block:8px}
.sect{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:8px}
/* Tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:none;background:none;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
.savebar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:9;display:flex;justify-content:center;padding-inline:12px}
.savebar>div{max-width:616px;width:100%;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 10px 10px 14px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.savebar span{flex:1;font-size:.88rem;font-weight:600}
.savebar .btn{padding:7px 12px}
.savebar .btn.ghost{color:var(--bg)}
/* Sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(10,14,25,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:88%;overflow:auto;display:flex;flex-direction:column;gap:12px}
.sheet h2{font-size:1.25rem}
.confirm{background:color-mix(in oklab,var(--danger) 10%,var(--surface));border:1px solid color-mix(in oklab,var(--danger) 40%,var(--line));border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(120px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-weight:600;font-size:.88rem}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

<script id="app-js">
(function(){
"use strict";
const DAYS=["Pazartesi","Salı","Çarşamba","Perşembe","Cuma"];
const DSHORT=["Pzt","Sal","Çar","Per","Cum"];
const MONTHS=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const COLORS=["#4f6bed","#e0951b","#17a579","#d9465f","#8b5cf6","#0ea5c6","#8a6d3b","#64748b"];
const saved=JSON.parse(document.getElementById("app-data").textContent);
let S=JSON.parse(JSON.stringify(saved));
try{const x=localStorage.getItem("sevtimes-data");if(x)S=JSON.parse(x);}catch(e){}
let dirty=false;
const ui={tab:"today",prog:null,editProg:null,editDay:null,sheet:null,confirm:false};
try{const u=JSON.parse(localStorage.getItem("programim-ui")||"{}");if(u.tab)ui.tab=u.tab;if(u.prog)ui.prog=u.prog;}catch(e){}
function keepUi(){try{localStorage.setItem("programim-ui",JSON.stringify({tab:ui.tab,prog:ui.prog}))}catch(e){}}

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const m=t=>{const [h,mm]=String(t||"0:0").split(":").map(Number);return h*60+(mm||0)};
const fmt=t=>t;
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>{const d=new Date();return{d,wd:(d.getDay()+6)%7,min:d.getHours()*60+d.getMinutes()+d.getSeconds()/60}};
const periods=()=>[...S.periods].sort((a,b)=>m(a.start)-m(b.start));
const prog=id=>S.programs.find(p=>p.id===id);

function markDirty(){dirty=true;render();}

/* ---------- data helpers ---------- */
function periodEntries(day,pid){
  const out=[];
  S.programs.filter(p=>p.type==="period").forEach(p=>p.entries.filter(e=>e.day===day&&e.period===pid).forEach(e=>out.push({p,e})));
  return out;
}
function timedEntries(day,breaks){
  const out=[];
  S.programs.filter(p=>p.type==="timed").forEach(p=>p.entries.filter(e=>e.day===day&&!!e.breaks===!!breaks).forEach(e=>out.push({p,e})));
  return out.sort((a,b)=>m(a.e.start)-m(b.e.start));
}
/* Build the day's slots: lessons, breaks (gaps between bells), sorted */
function slots(){
  const ps=periods(),out=[];let prev=m(S.dayStart||ps[0]?.start);
  ps.forEach(p=>{
    const s=m(p.start);
    if(s>prev)out.push({kind:"gap",start:prev,end:s});
    out.push({kind:p.isBreak?"break":"period",p,start:s,end:m(p.end)});
    prev=Math.max(prev,m(p.end));
  });
  const de=m(S.dayEnd||"00:00");if(de>prev)out.push({kind:"gap",start:prev,end:de,last:true});
  return out;
}
const hm=x=>String(Math.floor(x/60)).padStart(2,"0")+":"+String(Math.floor(x%60)).padStart(2,"0");
function pillHtml(p,e,extra){return `<div class="pill" style="--pc:${esc(p.color)}"><span class="ti">${esc(e.title)}</span>${e.sub?`<span class="su">${esc(e.sub)}</span>`:""}${e.note?`<span class="su">${esc(e.note)}</span>`:""}${extra||""}</div>`}
function firstBusy(day){
  for(const s of slots()){if(s.kind==="period"&&periodEntries(day,s.p.id).length)return s;}
  return null;
}

/* ---------- views ---------- */
function vToday(){
  const {d,wd,min}=today();
  const weekend=wd>4;
  const day=weekend?0:wd;
  const dateStr=`${d.getDate()} ${MONTHS[d.getMonth()]}`;
  let h=`<header class="top"><div><div class="eyebrow">${esc(S.settings.school||"")}</div><h1>${weekend?"Hafta sonu":DAYS[wd]}</h1></div><div class="muted mono">${dateStr}</div></header><div class="stack">`;
  if(weekend){h+=`<div class="card"><b>İyi hafta sonları.</b> <span class="muted">Aşağıda pazartesi günün var.</span></div>`;}
  else h+=nowCard(wd,min);
  const bd=timedEntries(day,true);
  bd.forEach(({p,e})=>{h+=`<div class="dutybanner" style="--pc:${esc(p.color)}"><div class="ic">N</div><div><b>${weekend?"Pazartesi":"Bugün"} teneffüs nöbetin var: ${esc(e.title)}</b><div class="muted" style="font-size:.88rem">${esc(e.sub||"")}${e.note?" · "+esc(e.note):""}</div></div></div>`});
  if(weekend)h+=`<h2 style="font-size:1.2rem;margin-top:4px">Pazartesi</h2>`;
  h+=`<div class="card tl" style="padding-block:4px">${timeline(day,weekend?-1:min)}</div></div>`;
  return h;
}
function nowCard(wd,min){
  const sl=slots();const cur=sl.find(s=>min>=s.start&&min<s.end);
  const tNow=timedEntries(wd,false).filter(({e})=>min>=m(e.start)&&min<m(e.end));
  const bd=timedEntries(wd,true);
  let lbl,big,meta=[],pct=null;
  if(!cur){
    const first=sl[0];
    if(first&&min<first.start){lbl="Okul öncesi";big="Gün başlıyor";meta.push(`Nöbet/giriş ${hm(first.start)}`);}
    else{lbl="Okul sonrası";big="Gün bitti";}
  }else{
    pct=Math.round((min-cur.start)/(cur.end-cur.start)*100);
    const left=Math.ceil(cur.end-min);
    if(cur.kind==="period"){
      const es=periodEntries(wd,cur.p.id);
      lbl=cur.p.label;big=es.length?es.map(x=>esc(x.e.title)).join(" + "):"Boş ders";
      if(es.length&&es[0].e.sub)meta.push(esc(es.map(x=>x.e.sub).filter(Boolean).join(" · ")));
    }else{
      lbl=cur.kind==="break"?cur.p.label:(cur.last?"Çıkış":"Teneffüs");
      big=bd.length?"Nöbet: "+esc(bd.map(x=>x.e.title).join(", ")):(cur.kind==="break"?esc(cur.p.label):"Teneffüs");
    }
    meta.push(`<span class="mono">${hm(cur.start)}–${hm(cur.end)}</span>`,`${left} dk kaldı`);
  }
  tNow.forEach(({e})=>meta.push(`<b>Nöbet: ${esc(e.title)}</b>`));
  // next busy thing
  let next=null;
  for(const s of sl){if(s.start<=min)continue;
    if(s.kind==="period"){const es=periodEntries(wd,s.p.id);if(es.length){next={t:s.start,txt:`${esc(s.p.label)} · ${es.map(x=>esc(x.e.title)+(x.e.sub?" "+esc(x.e.sub):"")).join(", ")}`};break;}}}
  const tn=timedEntries(wd,false).find(({e})=>m(e.start)>min);
  if(tn&&(!next||m(tn.e.start)<next.t))next={t:m(tn.e.start),txt:`Nöbet · ${esc(tn.e.title)}`};
  let h=`<section class="now"><div class="lbl"><span class="dot"></span>Şimdi · ${esc(lbl)}</div><div class="big">${big}</div>`;
  if(meta.length)h+=`<div class="meta">${meta.join("")?meta.map(x=>`<span>${x}</span>`).join(""):""}</div>`;
  if(pct!==null)h+=`<div class="bar"><i style="width:${pct}%"></i></div>`;
  h+=`<div class="next">${next?`Sıradaki <span class="mono">${hm(next.t)}</span> · ${next.txt}`:"Bugün başka dersin yok."}</div></section>`;
  return h;
}
function timeline(day,min){
  const rows=[];
  slots().forEach(s=>{
    if(s.kind==="gap")return;
    rows.push({start:s.start,end:s.end,s});
  });
  timedEntries(day,false).forEach(x=>rows.push({start:m(x.e.start),end:m(x.e.end),t:x}));
  rows.sort((a,b)=>a.start-b.start||(a.t?1:-1));
  return rows.map(r=>{
    const st=min<0?"":(min>=r.end?" past":(min>=r.start?" cur":""));
    if(r.t){return `<div class="row${st}"><div class="t"><b>${esc(r.t.e.start)}</b>${esc(r.t.e.end)}</div><div>${pillHtml(r.t.p,r.t.e,"")}</div></div>`}
    const s=r.s;
    if(s.kind==="break")return `<div class="row breakrow${st}"><div class="t"><b>${esc(s.p.start)}</b></div><div class="empty">${esc(s.p.label)} · ${esc(s.p.start)}–${esc(s.p.end)}</div></div>`;
    const es=periodEntries(day,s.p.id);
    return `<div class="row${st}"><div class="t"><b>${esc(s.p.start)}</b>${esc(s.p.end)}</div><div style="min-width:0"><div class="pl">${esc(s.p.label)}</div>${es.length?es.map(x=>pillHtml(x.p,x.e)).join(""):`<div class="empty">Boş</div>`}</div></div>`;
  }).join("");
}

function vWeek(){
  if(!ui.prog||!prog(ui.prog))ui.prog=S.programs[0]?.id;
  const p=prog(ui.prog);const wd=today().wd;
  let h=`<header class="top"><div><div class="eyebrow">Haftalık</div><h1>${esc(p?p.name:"Program yok")}</h1></div></header><div class="stack">`;
  h+=`<div class="chips" role="group" aria-label="Program seç">${S.programs.map(x=>`<button class="chip" style="--pc:${esc(x.color)}" data-act="pickprog" data-id="${esc(x.id)}" aria-pressed="${x.id===ui.prog}"><span class="sw"></span>${esc(x.name)}</button>`).join("")}</div>`;
  if(!p)return h+`<div class="card muted">Henüz program yok. Programlar sekmesinden ekleyebilirsin.</div></div>`;
  if(p.type==="period"){
    h+=`<div class="gridwrap"><table class="wk"><thead><tr><th></th>${DSHORT.map((d,i)=>`<th class="${i===wd?"today":""}">${d}</th>`).join("")}</tr></thead><tbody>`;
    periods().forEach(per=>{
      if(per.isBreak){h+=`<tr class="brk"><td class="mono">${esc(per.start)}</td><td colspan="5">${esc(per.label)} · ${esc(per.start)}–${esc(per.end)}</td></tr>`;return;}
      h+=`<tr><td><div class="pn">${esc(per.short||per.label)}</div><div class="pt">${esc(per.start)}</div></td>`;
      for(let d=0;d<5;d++){
        const es=p.entries.filter(e=>e.day===d&&e.period===per.id);
        h+=`<td class="${d===wd?"today":""}">${es.map(e=>`<div class="cell" style="--pc:${esc(p.color)}"><b>${esc(e.title)}</b>${e.sub?`<span>${esc(e.sub)}</span>`:""}</div>`).join("")}</td>`;
      }
      h+=`</tr>`;
    });
    h+=`</tbody></table></div>`;
    const cnt=p.entries.filter(e=>!["SUB"].includes(e.title)).length;
    h+=`<p class="muted" style="margin:0;font-size:.85rem">${p.entries.length} kayıt. Tablo telefonda yana kaydırılabilir.</p>`;
  }else{
    for(let d=0;d<5;d++){
      const es=p.entries.filter(e=>e.day===d).sort((a,b)=>m(a.start)-m(b.start));
      h+=`<div class="card daycard"><h3><span>${DAYS[d]}</span>${d===wd?`<span class="muted" style="font-size:.8rem;font-family:var(--f-body)">Bugün</span>`:""}</h3>${es.length?es.map(e=>`<div style="display:grid;grid-template-columns:86px 1fr;gap:10px;align-items:start;margin-top:6px"><span class="mono muted" style="padding-top:8px">${e.breaks?"Teneffüsler":esc(e.start)+"–"+esc(e.end)}</span>${pillHtml(p,e)}</div>`).join(""):`<div class="empty">Nöbet yok</div>`}</div>`;
    }
    if(p.reference){
      const me=(S.settings.name||"").toLocaleLowerCase("tr");
      h+=`<details class="ref"><summary>${esc(p.reference.title)}</summary><p class="muted" style="margin:8px 0 0;font-size:.85rem">${esc(p.reference.note||"")} Senin olduğun hücreler vurgulu.</p><div class="reftbl"><table><thead><tr><th>Nöbet alanı</th>${DAYS.map(d=>`<th>${d}</th>`).join("")}</tr></thead><tbody>${p.reference.rows.map(r=>`<tr>${r.map((c,i)=>`<${i?"td":"th"}${i&&me&&c.toLocaleLowerCase("tr").includes(me)?' class="me"':""}>${esc(c)}</${i?"td":"th"}>`).join("")}</tr>`).join("")}</tbody></table></div></details>`;
    }
  }
  return h+`</div>`;
}

function vPrograms(){
  if(ui.editProg&&prog(ui.editProg))return vProgEdit(prog(ui.editProg));
  let h=`<header class="top"><div><div class="eyebrow">Düzenle</div><h1>Programlar</h1></div></header><div class="stack"><div class="list">`;
  h+=S.programs.map(p=>`<button class="li" data-act="openprog" data-id="${esc(p.id)}" style="--pc:${esc(p.color)}"><span class="sw" style="width:14px;height:14px"></span><span class="grow"><b>${esc(p.name)}</b><span class="muted" style="font-size:.85rem">${p.type==="period"?"Ders saatlerine bağlı":"Serbest saatli"} · ${p.entries.length} kayıt</span></span><span class="chev">›</span></button>`).join("");
  h+=`</div><div class="btnrow"><button class="btn primary" data-act="newprog">+ Yeni program</button></div><p class="muted" style="margin:0;font-size:.88rem">Kulüp, sınav gözetmenliği, veli görüşmesi gibi yeni programlar ekleyebilirsin. <b>Ders saatlerine bağlı</b> programlar zil saatlerini kullanır. <b>Serbest saatli</b> programlarda başlangıç ve bitiş saatini sen yazarsın.</p></div>`;
  return h;
}
function vProgEdit(p){
  if(ui.editDay==null){const w=today().wd;ui.editDay=w>4?0:w;}
  const d=ui.editDay;
  let h=`<header class="top"><div><button class="btn ghost" data-act="backprog" style="margin-left:-6px">‹ Programlar</button><h1>${esc(p.name)}</h1></div><button class="btn" data-act="progsettings">Ayarlar</button></header><div class="stack">`;
  h+=`<div class="chips" role="group" aria-label="Gün seç">${DAYS.map((n,i)=>`<button class="chip" data-act="editday" data-d="${i}" aria-pressed="${i===d}">${n}</button>`).join("")}</div>`;
  let es=p.entries.filter(e=>e.day===d);
  if(p.type==="period"){const order=periods().map(x=>x.id);es.sort((a,b)=>order.indexOf(a.period)-order.indexOf(b.period));}
  else es.sort((a,b)=>m(a.start)-m(b.start));
  h+=`<div class="list">`;
  if(!es.length)h+=`<div class="li muted">${DAYS[d]} için kayıt yok.</div>`;
  h+=es.map(e=>{const per=p.type==="period"?S.periods.find(x=>x.id===e.period):null;
    const when=p.type==="period"?(per?`${esc(per.label)} · ${esc(per.start)}`:"Silinmiş ders saati"):(e.breaks?"Teneffüslerde":`${esc(e.start)}–${esc(e.end)}`);
    return `<button class="li" data-act="editentry" data-id="${esc(e.id)}" style="--pc:${esc(p.color)}"><span class="mono muted" style="width:92px;flex:none;font-size:.78rem">${when}</span><span class="grow"><b>${esc(e.title)}</b><span class="muted" style="font-size:.85rem">${esc([e.sub,e.note].filter(Boolean).join(" · "))}</span></span><span class="chev">›</span></button>`}).join("");
  h+=`</div><div class="btnrow"><button class="btn primary" data-act="addentry">+ ${DAYS[d]} gününe ekle</button></div></div>`;
  return h;
}

function vSettings(){
  let h=`<header class="top"><div><div class="eyebrow">Ayarlar</div><h1>Zil saatleri</h1></div></header><div class="stack">`;
  h+=`<div class="list"><div class="bellrow head"><span>Ad</span><span>Başlar</span><span>Biter</span><span></span></div>`;
  h+=periods().map(p=>`<div class="bellrow"><input id="bl-${esc(p.id)}" data-bell="label" data-id="${esc(p.id)}" value="${esc(p.label)}" aria-label="Ad"><input id="bs-${esc(p.id)}" type="time" data-bell="start" data-id="${esc(p.id)}" value="${esc(p.start)}" aria-label="Başlangıç"><input id="be-${esc(p.id)}" type="time" data-bell="end" data-id="${esc(p.id)}" value="${esc(p.end)}" aria-label="Bitiş"><button class="x" data-act="delbell" data-id="${esc(p.id)}" aria-label="${esc(p.label)} sil">×</button></div>`).join("");

  h+=`<p class="muted" style="margin:0;font-size:.85rem">Ders saatleri arasındaki boşluklar teneffüs sayılır. Teneffüs nöbetin varsa o saatlerde “Şimdi” kartında nöbet yerin görünür.</p>`;
  h+=`<div class="sect">Genel</div><div class="card stack"><div class="field"><label for="sn">Adın (nöbet çizelgesinde vurgulanır)</label><input id="sn" data-set="settings.name" value="${esc(S.settings.name||"")}"></div><div class="field"><label for="ss">Okul</label><input id="ss" data-set="settings.school" value="${esc(S.settings.school||"")}"></div></div>`;
  h+=`<div class="sect">Telefona kurulum</div><div class="card" style="font-size:.9rem"><b>iPhone:</b> Safari'de bu sayfayı aç, alttaki <b>Paylaş</b> düğmesine (kare ve yukarı ok) dokun, <b>Ana Ekrana Ekle</b>'yi seç.<br><b>Android:</b> Chrome'da <b>⋮</b> menüsünden <b>Ana ekrana ekle</b>.<br><span class="muted">Değişikliklerin sadece bu telefonda saklanır.</span></div>`;
  return h+`</div>`;
}

/* ---------- sheets ---------- */
function sheetHtml(){
  const sh=ui.sheet;if(!sh)return "";
  let h=`<div class="scrim" data-act="closesheet"><form class="sheet" id="sheetform" data-stop="1">`;
  if(sh.kind==="entry"){
    const p=prog(sh.prog);const e=sh.entry;
    h+=`<h2>${sh.isNew?"Yeni kayıt":"Kaydı düzenle"}</h2>`;
    h+=`<div class="field"><label for="f-day">Gün</label><select id="f-day" name="day">${DAYS.map((n,i)=>`<option value="${i}"${i===e.day?" selected":""}>${n}</option>`).join("")}</select></div>`;
    if(p.type==="period"){
      h+=`<div class="field"><label for="f-per">Ders saati</label><select id="f-per" name="period">${periods().map(x=>`<option value="${esc(x.id)}"${x.id===e.period?" selected":""}>${esc(x.label)} (${esc(x.start)}–${esc(x.end)})</option>`).join("")}</select></div>`;
    }else{
      h+=`<label class="check"><input type="checkbox" id="f-br" name="breaks"${e.breaks?" checked":""}> Teneffüslerde (bütün gün teneffüs nöbeti)</label>`;
      h+=`<div class="two"><div class="field"><label for="f-st">Başlangıç</label><input id="f-st" type="time" name="start" value="${esc(e.start||"")}"></div><div class="field"><label for="f-en">Bitiş</label><input id="f-en" type="time" name="end" value="${esc(e.end||"")}"></div></div>`;
    }
    h+=`<div class="field"><label for="f-ti">${p.type==="period"?"Sınıf / başlık":"Yer / başlık"}</label><input id="f-ti" name="title" required value="${esc(e.title||"")}" placeholder="${p.type==="period"?"ör. 7C":"ör. Üçgen Alan"}"></div>`;
    h+=`<div class="field"><label for="f-su">${p.type==="period"?"Ders":"Açıklama"}</label><input id="f-su" name="sub" value="${esc(e.sub||"")}" placeholder="${p.type==="period"?"ör. Müzik/Görsel":"ör. 7-8. Sınıflar"}"></div>`;
    h+=`<div class="field"><label for="f-no">Not</label><input id="f-no" name="note" value="${esc(e.note||"")}" placeholder="ör. Nöbet arkadaşınla"></div>`;
    h+=`<div class="btnrow"><button class="btn primary" type="submit">${sh.isNew?"Ekle":"Uygula"}</button><button class="btn" type="button" data-act="closesheet">Vazgeç</button>${sh.isNew?"":`<span style="flex:1"></span><button class="btn danger" type="button" data-act="askdel">Sil</button>`}</div>`;
    if(ui.confirm)h+=`<div class="confirm"><b>Bu kayıt silinsin mi?</b><div class="btnrow"><button class="btn danger" type="button" data-act="delentry">Evet, sil</button><button class="btn" type="button" data-act="nodel">Hayır</button></div></div>`;
  }else if(sh.kind==="prog"){
    const p=sh.isNew?{name:"",type:"timed",color:COLORS[(S.programs.length+2)%COLORS.length]}:prog(sh.prog);
    const col=sh.color||p.color;
    h+=`<h2>${sh.isNew?"Yeni program":"Program ayarları"}</h2>`;
    h+=`<div class="field"><label for="p-name">Program adı</label><input id="p-name" name="name" required value="${esc(p.name)}" placeholder="ör. Kulüp Programı"></div>`;
    if(sh.isNew)h+=`<div class="field"><label for="p-type">Türü</label><select id="p-type" name="type"><option value="timed">Serbest saatli (nöbet, toplantı, gözetmenlik…)</option><option value="period">Ders saatlerine bağlı (1. ders, 2. ders…)</option></select></div>`;
    h+=`<div class="field"><label>Renk</label><div class="colors">${COLORS.map(c=>`<button type="button" data-act="pickcolor" data-c="${c}" style="--pc:${c}" aria-label="Renk ${c}" aria-pressed="${c===col}"></button>`).join("")}</div></div>`;
    h+=`<div class="btnrow"><button class="btn primary" type="submit">${sh.isNew?"Oluştur":"Uygula"}</button><button class="btn" type="button" data-act="closesheet">Vazgeç</button>${sh.isNew?"":`<span style="flex:1"></span><button class="btn danger" type="button" data-act="askdel">Programı sil</button>`}</div>`;
    if(ui.confirm)h+=`<div class="confirm"><b>“${esc(p.name)}” ve içindeki ${p.entries.length} kayıt silinsin mi?</b><div class="btnrow"><button class="btn danger" type="button" data-act="delprog">Evet, sil</button><button class="btn" type="button" data-act="nodel">Hayır</button></div></div>`;
  }
  return h+`</form></div>`;
}

/* ---------- render ---------- */
const ICONS={
 today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
 week:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M9 10v10M15 10v10M8 3v4M16 3v4"/></svg>',
 programs:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 6h14M5 12h14M5 18h9"/><circle cx="19" cy="18" r="2"/></svg>',
 settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3.5a6 6 0 0 0-6 6v3.5L4.5 16h15L18 13V9.5a6 6 0 0 0-6-6Z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>'};
const TABS=[["today","Bugün"],["week","Hafta"],["programs","Programlar"],["settings","Zil saatleri"]];
let toastMsg="";
function render(){
  const app=document.getElementById("app");
  const active=document.activeElement&&document.activeElement.id;
  let body=ui.tab==="week"?vWeek():ui.tab==="programs"?vPrograms():ui.tab==="settings"?vSettings():vToday();
  body+=`<nav class="tabs">${TABS.map(([k,l])=>`<button data-act="tab" data-tab="${k}"${ui.tab===k?' aria-current="page"':""}>${ICONS[k]}${l}</button>`).join("")}</nav>`;
  if(dirty)body+=`<div class="savebar"><div><span>${saving?"Kaydediliyor…":"Kaydedilmemiş değişiklik var"}</span><button class="btn ghost" data-act="revert">Geri al</button><button class="btn primary" data-act="save"${saving?" disabled":""}>Kaydet</button></div></div>`;
  body+=sheetHtml();
  if(toastMsg)body+=`<div class="toast" role="status">${esc(toastMsg)}</div>`;
  app.innerHTML=body;
  if(active){const el=document.getElementById(active);if(el&&el.tagName==="INPUT"&&!el.closest(".sheet")){el.focus();}}
}
function toast(t){toastMsg=t;render();setTimeout(()=>{toastMsg="";render()},2600)}

/* ---------- saving: kept on this phone ---------- */
let saving=false;
const STORE="sevtimes-data";
function save(){
  try{localStorage.setItem(STORE,JSON.stringify(S));dirty=false;toast("Kaydedildi");}
  catch(e){toast("Kaydedilemedi. Safari'de özel sekme kapalı olmalı.");}
}
/* ---------- events ---------- */
document.addEventListener("click",ev=>{
  const t=ev.target.closest("[data-act]");
  if(!t){return;}
  const a=t.dataset.act;
  if(a==="closesheet"&&t.classList.contains("scrim")&&ev.target!==t)return;
  const sh=ui.sheet;
  switch(a){
    case "tab":ui.tab=t.dataset.tab;if(ui.tab!=="programs"){ui.editProg=null;}keepUi();window.scrollTo(0,0);break;
    case "pickprog":ui.prog=t.dataset.id;keepUi();break;
    case "openprog":ui.editProg=t.dataset.id;ui.editDay=null;window.scrollTo(0,0);break;
    case "backprog":ui.editProg=null;break;
    case "editday":ui.editDay=+t.dataset.d;break;
    case "addentry":{const p=prog(ui.editProg);ui.confirm=false;ui.sheet={kind:"entry",prog:p.id,isNew:true,entry:p.type==="period"?{day:ui.editDay,period:periods().find(x=>!x.isBreak)?.id}:{day:ui.editDay,start:"12:50",end:"13:25"}};break;}
    case "editentry":{const p=prog(ui.editProg);ui.confirm=false;ui.sheet={kind:"entry",prog:p.id,isNew:false,entry:{...p.entries.find(e=>e.id===t.dataset.id)}};break;}
    case "newprog":ui.confirm=false;ui.sheet={kind:"prog",isNew:true};break;
    case "progsettings":ui.confirm=false;ui.sheet={kind:"prog",isNew:false,prog:ui.editProg};break;
    case "pickcolor":{const f=document.getElementById("p-name");if(f)sh.draftName=f.value;sh.color=t.dataset.c;render();const g=document.getElementById("p-name");if(g&&sh.draftName!=null)g.value=sh.draftName;return;}
    case "closesheet":ui.sheet=null;ui.confirm=false;break;
    case "askdel":ui.confirm=true;break;
    case "nodel":ui.confirm=false;break;
    case "delentry":{const p=prog(sh.prog);p.entries=p.entries.filter(e=>e.id!==sh.entry.id);ui.sheet=null;ui.confirm=false;markDirty();return;}
    case "delprog":S.programs=S.programs.filter(p=>p.id!==sh.prog);ui.sheet=null;ui.confirm=false;ui.editProg=null;markDirty();return;
    case "addbell":{const ps=periods().filter(x=>!x.isBreak);const last=periods().slice(-1)[0];const n=ps.length;const st=last?m(last.end)+5:480;S.periods.push({id:"p"+uid(),label:`${n} . Ders`.replace(" .","."),short:String(n),start:hm(st),end:hm(st+40)});markDirty();return;}
    case "addbreak":{const last=periods().slice(-1)[0];const st=last?m(last.end):720;S.periods.push({id:"b"+uid(),label:"Ara",short:"ARA",start:hm(st),end:hm(st+30),isBreak:true});markDirty();return;}
    case "delbell":S.periods=S.periods.filter(p=>p.id!==t.dataset.id);markDirty();return;
    case "save":save();return;
    case "revert":try{const x=localStorage.getItem("sevtimes-data");S=x?JSON.parse(x):JSON.parse(JSON.stringify(saved));}catch(e){S=JSON.parse(JSON.stringify(saved));}dirty=false;ui.sheet=null;break;
  }
  render();
});
document.addEventListener("submit",ev=>{
  ev.preventDefault();
  const f=ev.target;const fd=new FormData(f);const sh=ui.sheet;if(!sh)return;
  if(sh.kind==="entry"){
    const p=prog(sh.prog);const e=sh.entry;
    e.day=+fd.get("day");e.title=String(fd.get("title")||"").trim();e.sub=String(fd.get("sub")||"").trim();e.note=String(fd.get("note")||"").trim();
    if(p.type==="period")e.period=fd.get("period");
    else{e.breaks=!!fd.get("breaks");e.start=fd.get("start")||(e.breaks?S.dayStart:"");e.end=fd.get("end")||(e.breaks?S.dayEnd:"");
      if(!e.breaks&&(!e.start||!e.end||m(e.end)<=m(e.start))){toast("Bitiş saati başlangıçtan sonra olmalı.");return;}}
    if(sh.isNew){e.id=uid();p.entries.push(e);}else{const i=p.entries.findIndex(x=>x.id===e.id);p.entries[i]=e;}
    ui.editDay=e.day;
  }else{
    const name=String(fd.get("name")||"").trim();if(!name)return;
    if(sh.isNew){const np={id:"g"+uid(),name,type:fd.get("type")||"timed",color:sh.color||COLORS[(S.programs.length+2)%COLORS.length],entries:[]};S.programs.push(np);ui.editProg=np.id;ui.editDay=null;}
    else{const p=prog(sh.prog);p.name=name;if(sh.color)p.color=sh.color;}
  }
  ui.sheet=null;ui.confirm=false;markDirty();
});
document.addEventListener("change",ev=>{
  const el=ev.target;
  if(el.dataset.bell){const p=S.periods.find(x=>x.id===el.dataset.id);if(!p)return;const v=el.value;if(el.dataset.bell!=="label"&&!v)return;p[el.dataset.bell]=v;if(el.dataset.bell==="label"&&!p.isBreak){const mm=v.match(/\d+/);p.short=mm?mm[0]:v.slice(0,3).toLocaleUpperCase("tr");}markDirty();}
  else if(el.dataset.set){const path=el.dataset.set.split(".");let o=S;while(path.length>1)o=o[path.shift()];o[path[0]]=el.value;markDirty();}
});
setInterval(()=>{if(ui.tab==="today"&&!ui.sheet)render()},30000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&ui.tab==="today"&&!ui.sheet)render()});
render();
})();
</script>

<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}</script>
</body>
